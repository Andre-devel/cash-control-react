server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback — all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite adds content hashes)
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker — an exact `location =` beats the regex block above (nginx picks
    # the most specific match, and exact wins over regex), so this overrides the 1-year
    # cache the .js rule would otherwise give it. A stale service worker means the Web
    # Share Target handler and the app it serves can drift apart for up to a year.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # .webmanifest isn't in nginx's default mime.types; without this it's served as
    # text/plain and some browsers refuse to treat the app as installable.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        default_type application/manifest+json;
    }

    # Never cache index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
